# FINNISH - Docker Compose Configuration
# AI-powered Scientific Illustration Tool

version: '3.8'

services:
  # =============================================================================
  # Production Service
  # =============================================================================
  finnish:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_ANTHROPIC_API_KEY=${VITE_ANTHROPIC_API_KEY:-}
    image: finnish:latest
    container_name: finnish-app
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - finnish-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # =============================================================================
  # Development Service
  # =============================================================================
  finnish-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: finnish:dev
    container_name: finnish-dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_ANTHROPIC_API_KEY=${VITE_ANTHROPIC_API_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - finnish-network
    profiles:
      - dev

  # =============================================================================
  # Testing Service
  # =============================================================================
  finnish-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: finnish:test
    container_name: finnish-test
    environment:
      - NODE_ENV=test
      - CI=true
    command: npm run test -- --run
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - finnish-network
    profiles:
      - test

networks:
  finnish-network:
    driver: bridge

volumes:
  node_modules:
